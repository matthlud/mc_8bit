name: RTL and netlist CI

on:
  push:
    branches: [main, 'fix/**', 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: RTL, Yosys, and synthesized-netlist verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install HDL tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y iverilog yosys

      - name: Run RTL regression
        run: make test

      - name: Run generic synthesis and netlist regression
        run: make test-netlist

      - name: Compile-only lint
        run: make lint

      - name: Upload simulation and synthesis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl-build-artifacts
          if-no-files-found: warn
          path: artifacts/
